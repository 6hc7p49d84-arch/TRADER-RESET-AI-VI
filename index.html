<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trader Reset AI</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>TRADER RESET <span>AI</span></b><small>Process over profit.</small></div><button id="reset">Reset day</button></header>
<main>
<section id="home" class="page active"><div class="card hero"><div><small>TODAY'S DISCIPLINE</small><div id="score" class="score">100</div><p>Execution matters more than P/L.</p></div><div id="ring">100%</div></div><div class="stats"><div class="card"><small>Trades</small><strong id="count">0</strong></div><div class="card"><small>Daily R</small><strong id="r">0.00R</strong></div><div class="card"><small>Rule breaks</small><strong id="breaks">0</strong></div><div class="card"><small>Status</small><strong id="status">READY</strong></div></div><button class="primary" onclick="show('check')">Start trading session</button><div class="card quote"><b>Today's rule</b><p>I don't control what the market gives me. I control what I do with it.</p></div></section>
<section id="check" class="page"><h1>Pre-trade checklist</h1><div class="card" id="checks"></div><button id="pass" class="primary" disabled>Checklist incomplete</button></section>
<section id="journal" class="page"><h1>Trade journal</h1><form class="card" id="form">
<label>Instrument<input name="instrument" placeholder="XAUUSD" required></label><label>Direction<select name="direction"><option>Buy</option><option>Sell</option></select></label><label>Result (R)<input name="result" type="number" step=".01" placeholder="1.5" required></label><label>Risk %<input name="risk" type="number" step=".01" placeholder=".5"></label><label>Setup<input name="setup" placeholder="Your setup"></label><label>Why did you enter?<textarea name="reason"></textarea></label><label>Emotion<select name="emotion"><option>Calm</option><option>Confident</option><option>FOMO</option><option>Revenge</option><option>Fearful</option></select></label><label><input name="followed" type="checkbox"> I followed my trading plan.</label><button class="primary">Save trade</button></form><div id="trades"></div></section>
<section id="review" class="page"><h1>Discipline review</h1><div class="card" id="review"></div></section></main>
<nav><button onclick="show('home')">⌂<small>Home</small></button><button onclick="show('check')">✓<small>Checklist</small></button><button onclick="show('journal')">＋<small>Journal</small></button><button onclick="show('review')">◉<small>Review</small></button></nav>
<script src="app.js"></script></body></html>
